<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173925"><title>Aayush Venue Finder</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f1e8;color:#162018}.app{max-width:720px;margin:auto;padding:16px 14px 40px}h1{font-size:24px;margin:4px 0}p{color:#667067;line-height:1.45}.card{background:#fff;border:1px solid #e2e3dc;border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 8px 24px #1521170d}.search{display:flex;gap:8px}input,button{font:inherit}input{flex:1;min-width:0;border:1px solid #d8ddd6;border-radius:13px;padding:13px 14px;outline:0}input:focus{border-color:#173925}.go{border:0;border-radius:13px;background:#173925;color:#fff;font-weight:850;padding:0 16px}.hint{font-size:12px;margin-top:8px;color:#788079}.result{display:none}.result.show{display:block}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#778078}.title{font-size:22px;font-weight:900;margin:4px 0}.meta{font-size:14px;line-height:1.45;color:#5f6b61}.ok{display:inline-block;margin-top:10px;background:#edf5ed;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.choices{display:grid;gap:8px;margin-top:10px}.choice{width:100%;text-align:left;border:1px solid #dfe3dc;background:#fff;border-radius:12px;padding:11px}.choice b{display:block}.actions{display:flex;gap:8px;margin-top:12px}.actions a{flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:11px 12px;font-weight:850}.primary{background:#173925;color:#fff}.secondary{background:#eef1ec;color:#162018}@media(max-width:520px){.app{padding-top:10px}.search{display:grid;grid-template-columns:1fr auto}.actions{flex-direction:column}}</style></head><body><main class="app"><h1>Find a venue</h1><p>Search using the words guests naturally use. Only known aliases are matched, so the finder will not guess an uncertain destination.</p><section class="card"><div class="search"><input id="q" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="words" placeholder="Try: main gate, front desk, palace de shaan…"><button class="go" id="go">Find</button></div><div class="hint">Examples: Palace, Palace de Shaan, Suhana Lawn, Suhanav Lawn, pool, reception, front desk, main gate, Manvar Hall, Dhaba.</div></section><section class="card result" id="result"><div class="eyebrow" id="kind"></div><div class="title" id="title"></div><div class="meta" id="meta"></div><div id="extra"></div><div class="actions"><a class="primary" href="navigator.html">Open resort map</a><a class="secondary" href="navigator-room-finder.html">Find a room</a></div></section></main><script>const VENUES=[{id:'entrance',name:'Main Entrance',kind:'Arrival',zone:'Main gate / arrival point',aliases:['main entrance','entrance','main gate','gate','entry gate','resort gate','entry']},{id:'pool',name:'Swimming Pool',kind:'Leisure',zone:'Pool Zone',aliases:['swimming pool','pool','poolside','pool side','swimming']},{id:'suhanav',name:'Suhanav Lawn',kind:'Wedding venue',zone:'Wedding / Lawn Zone',aliases:['suhanav lawn','suhana lawn','suhanav','suhana','lawn','wedding lawn']},{id:'palace',name:'Aayush Palace',kind:'Wedding / Shoot venue',zone:'Palace Zone',aliases:['aayush palace','palace','palace de shaan','palace de shan','de shaan','shoot palace']},{id:'peacock',name:'Peacock Room',kind:'Venue inside Palace zone',zone:'Palace Zone',aliases:['peacock room','peacock','peacock hall']},{id:'reception',name:'Reception & N Rooms',kind:'Stay / Help desk',zone:'Reception / N Rooms',aliases:['reception','front desk','help desk','lobby','n rooms','n block','n room']},{id:'manvar',name:'Manvar Hall / 500 Rooms',kind:'Stay / Venue',zone:'Manvar / 500 Rooms',aliases:['manvar hall','manvar','500 rooms','500 room','five hundred rooms','500 block']},{id:'dhaba',name:'Dhaba / SB-1',kind:'Dining / Stay',zone:'Dhaba / SB-1',aliases:['dhaba','sb-1','sb1','sb room']}];const $=s=>document.querySelector(s);function norm(s){return s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,' ').trim()}function score(v,t){let q=norm(t);if(!q)return 0;let a=v.aliases.map(norm);if(a.includes(q))return 100;if(norm(v.name)===q)return 100;let starts=a.some(x=>x.startsWith(q)||q.startsWith(x));if(starts)return 70;let words=q.split(' ').filter(Boolean);let hay=[norm(v.name),...a].join(' ');return words.length&&words.every(w=>hay.includes(w))?45:0}function show(){let q=$('#q').value;let ranked=VENUES.map(v=>({v,s:score(v,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);let r=$('#result'),extra=$('#extra');r.classList.add('show');extra.innerHTML='';if(!ranked.length){$('#kind').textContent='No safe match';$('#title').textContent='Destination not recognized';$('#meta').textContent='Try a venue name or one of the examples above. The finder intentionally does not guess unknown places.';return}let best=ranked[0].s,top=ranked.filter(x=>x.s===best);if(top.length===1){let v=top[0].v;$('#kind').textContent=v.kind;$('#title').textContent=v.name;$('#meta').textContent='Known map destination • '+v.zone;extra.innerHTML='<span class="ok">✓ Safe alias match</span>';return}$('#kind').textContent='Choose a destination';$('#title').textContent='More than one known place matches';$('#meta').textContent='Select the place you meant instead of guessing.';let box=document.createElement('div');box.className='choices';top.forEach(({v})=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+v.name+'</b><span>'+v.kind+' • '+v.zone+'</span>';b.onclick=()=>{$('#q').value=v.name;show()};box.appendChild(b)});extra.appendChild(box)}$('#go').onclick=show;$('#q').onkeydown=e=>{if(e.key==='Enter')show()};</script></body></html>
