<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Day Outing & Activities — Aayush Resort</title><style>body{margin:0;background:#e8dfd0;color:#182127;font-family:Arial}header{padding:22px 5%;display:flex;justify-content:space-between;background:#102d38;color:white}a{color:inherit;text-decoration:none}.hero{padding:90px 5% 50px}.hero h1{font:clamp(55px,9vw,120px)/.9 Georgia;margin:10px 0}.hero b{font-size:24px}.game{margin:20px 5% 100px;padding:35px;border-radius:30px;background:#102d38;color:white;max-width:650px}.wheelwrap{position:relative;width:320px;margin:30px auto}.pointer{position:absolute;top:-17px;left:147px;z-index:2;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid #fff}.wheel{width:300px;height:300px;border-radius:50%;position:relative;overflow:hidden;border:8px solid #fff;transition:2.2s cubic-bezier(.12,.7,.1,1);background:conic-gradient(#d8b274 0 45deg,#71364b 45deg 90deg,#397182 90deg 135deg,#7a6844 135deg 180deg,#d8b274 180deg 225deg,#71364b 225deg 270deg,#397182 270deg 315deg,#7a6844 315deg)}.labels{position:absolute;inset:0;pointer-events:none}.labels span{position:absolute;left:50%;top:50%;font-size:11px;font-weight:bold;transform-origin:0 0}.game button{padding:14px 22px;border:0;border-radius:99px;background:#d8b274;font-weight:bold}</style></head><body><header><a href='index.html'>AAYUSH RESORT</a><a href='enquire.html?type=Day%20Outing'>ENQUIRE</a></header><section class='hero'><small>ONE DAY PICNIC · ACTIVITIES</small><h1>A full day<br>away.</h1><b>09:00 AM — 06:00 PM</b><p>Pool, games, open resort time and group experiences in a single-day visit.</p></section><section class='game'><small>SPIN THE DAY</small><h2>What should you try first?</h2><div class='wheelwrap'><div class='pointer'></div><div class='wheel' id='wheel'></div></div><button id='spin'>SPIN</button><p id='result'>The answer will always match the slice the pointer lands on.</p></section><script>const acts=['Pool Time','Carrom','Cycling','Palace Walk','Table Tennis','Foosball','Family Game','Surprise Pick'];let rotation=0;spin.onclick=()=>{const pick=Math.floor(Math.random()*8),slice=45,target=360-(pick*slice+slice/2);rotation+=1440+((target-(rotation%360)+360)%360);wheel.style.transform='rotate('+rotation+'deg)';setTimeout(()=>result.textContent='Your pick: '+acts[pick]+' ✦',2250)}</script></body></html>
