<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173925"><title>Start Navigation | Aayush Resort</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f1e8;color:#162018;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(100%,520px);background:#fff;border:1px solid #e1e3dc;border-radius:22px;padding:22px;box-shadow:0 12px 32px #15211712}h1{margin:0 0 5px;font-size:24px}.sub{color:#657066;margin:0 0 18px}.status{background:#eef3ed;border-radius:14px;padding:13px 14px;line-height:1.45}.actions{display:grid;gap:9px;margin-top:15px}a{display:block;text-align:center;text-decoration:none;border-radius:13px;padding:12px 14px;font-weight:850;background:#173925;color:#fff}.alt{background:#eef1ec;color:#173925}.tiny{font-size:12px;color:#778078;margin-top:13px}.safe{display:inline-block;margin-top:10px;padding:6px 9px;border-radius:999px;background:#edf5ed;color:#31583a;font-size:11px;font-weight:850}</style></head><body><main class="card"><h1>Aayush Navigator</h1><p class="sub">Preparing the safest available route…</p><div class="status" id="status">Checking destination information.</div><div class="actions" id="actions"></div><span class="safe">✓ No uncertain route guesses</span><p class="tiny">Aayush Resort • Guest wayfinding prototype</p></main><script>const Z={entrance:'Main Entrance',reception:'Reception',palace:'Aayush Palace',peacock:'Peacock Room',suhanav:'Suhanav Lawn',pool:'Swimming Pool',manvar:'Manvar Hall',dhaba:'Dhaba'};const p=new URLSearchParams(location.search);let rawFrom=(p.get('from')||p.get('at')||'').toLowerCase();const rawTo=(p.get('to')||'').toLowerCase(),rawRoom=(p.get('room')||'').trim();let restored=false;if(!rawFrom){try{const saved=(sessionStorage.getItem('aayushCheckpoint')||'').toLowerCase();if(Z[saved]){rawFrom=saved;restored=true}}catch{}}const validFrom=Z[rawFrom]?rawFrom:'',validTo=Z[rawTo]?rawTo:'';function normRoom(v){v=v.toUpperCase().replace(/^ROOM\s*/,'').replace(/\s+/g,'');if(/^N\d{3}$/.test(v)||/^\d{3}$/.test(v)||/^SB-?\d+$/.test(v))return v.replace(/^SB(\d)/,'SB-$1');let m=v.match(/^([CET])-?(\d+)([AB])?$/);return m?m[1]+'-'+m[2]+(m[3]?' '+m[3]:''):''}const room=normRoom(rawRoom),s=document.getElementById('status'),a=document.getElementById('actions');let links=[];const originNote=restored?'Using your last confirmed checkpoint at '+Z[validFrom]+'. ':'';function add(href,label,alt=false){links.push('<a'+(alt?' class="alt"':'')+' href="'+href+'">'+label+'</a>')}if(validFrom&&room){s.textContent=originNote+'Starting at '+Z[validFrom]+' and continuing to Room '+room+'.';add('navigator-room-finder.html?room='+encodeURIComponent(room)+'&from='+encodeURIComponent(validFrom),'Find Room '+room);add('navigator.html','Main navigator',true)}else if(validFrom&&validTo&&validFrom!==validTo){s.textContent=originNote+Z[validFrom]+' → '+Z[validTo]+'.';add('navigator-route.html?from='+encodeURIComponent(validFrom)+'&to='+encodeURIComponent(validTo),'Preview route');add('navigator.html','Main navigator',true)}else if(validFrom&&validTo&&validFrom===validTo){s.textContent='You are already at '+Z[validFrom]+'.';add('navigator-checkpoint.html?at='+encodeURIComponent(validFrom),'Choose another destination');add('navigator.html','Main navigator',true)}else if(validFrom&&!validTo&&!room){s.textContent=originNote+'Confirmed starting point: '+Z[validFrom]+'. Choose your destination next.';add('navigator-checkpoint.html?at='+encodeURIComponent(validFrom),'Use this checkpoint');add('navigator-venue-finder.html','Find a venue',true)}else if(validTo&&room){s.textContent='Room '+room+' is mapped to the '+Z[validTo]+' route zone. Choose a known starting point instead of guessing your location.';if(validTo!=='reception')add('navigator-route.html?from=reception&to='+encodeURIComponent(validTo)+'&room='+encodeURIComponent(room),'Route from Reception to Room '+room);if(validTo!=='entrance')add('navigator-route.html?from=entrance&to='+encodeURIComponent(validTo)+'&room='+encodeURIComponent(room),'Route from Main Entrance to Room '+room);add('navigator-room-finder.html?room='+encodeURIComponent(room),'Back to room details',true)}else if(room){s.textContent='Room '+room+' recognized. Choose or confirm your starting point next.';add('navigator-room-finder.html?room='+encodeURIComponent(room),'Find Room '+room);add('navigator.html','Main navigator',true)}else if(validTo){s.textContent='Destination recognized: '+Z[validTo]+'. Choose a known starting point instead of guessing your position.';if(validTo!=='reception')add('navigator-route.html?from=reception&to='+encodeURIComponent(validTo),'Route from Reception');if(validTo!=='entrance')add('navigator-route.html?from=entrance&to='+encodeURIComponent(validTo),'Route from Main Entrance');add('navigator-venue-finder.html','Find another venue',true)}else{s.textContent='No complete route information was found. Search with the dedicated room or venue finder.';add('navigator-room-finder.html','Find a room');add('navigator-venue-finder.html','Find a venue');add('navigator.html','Open resort map',true)}a.innerHTML=links.join('');</script></body></html>
