<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Enquire — Aayush Resort</title><style>body{margin:0;background:#d8b274;color:#17110c;font-family:Arial}header{padding:22px 5%;display:flex;justify-content:space-between}a{color:inherit;text-decoration:none}.box{max-width:900px;margin:40px auto 90px;background:#f8f3eb;border-radius:30px;padding:40px}.box h1{font:clamp(50px,8vw,90px) Georgia;margin:5px 0 30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:15px;border:1px solid #cbbba7;border-radius:12px;background:#fff}.field textarea{min-height:110px}.bad input,.bad select{border:2px solid #b51d35;background:#fff6f6}.help{font-size:11px;color:#a21930;margin-top:5px}.full{grid-column:1/-1}button{margin-top:20px;padding:15px 22px;border:0;border-radius:99px;background:#541324;color:#fff;font-weight:bold}@media(max-width:600px){.box{margin:15px;padding:24px 16px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><a href='index.html'>AAYUSH RESORT</a><span>SMART ENQUIRY</span></header><main class='box'><h1>Tell us the plan.</h1><form id='f'><div class='grid'><div class='field'><input id='name' placeholder='Guest Name *'></div><div class='field'><input id='phone' inputmode='numeric' placeholder='Mobile Number *'></div><div class='field'><select id='type'><option value=''>Booking Type *</option><option>Stay</option><option>Wedding</option><option>Shoot</option><option>Corporate</option><option>Day Outing</option></select></div><div class='field'><input id='pax' type='number' placeholder='Guests / Crew *'></div><div class='field' id='fromF'><label>Start / Check-in *</label><input id='from' type='date'></div><div class='field' id='toF'><label>End / Check-out *</label><input id='to' type='date'></div><div class='field' id='dayF' style='display:none'><label>Visit Date * · 09:00 AM–06:00 PM</label><input id='day' type='date'></div><div class='field'><input id='rooms' type='number' placeholder='Rooms Required'></div><div class='field full'><textarea id='note' placeholder='Tell us more about your requirement'></textarea></div></div><div id='summary' class='help'></div><button>CONTINUE TO WHATSAPP →</button></form></main><script>const q=new URLSearchParams(location.search);if(q.get('type'))type.value=q.get('type');function mode(){let d=type.value==='Day Outing';fromF.style.display=toF.style.display=d?'none':'block';dayF.style.display=d?'block':'none';rooms.parentElement.style.display=d?'none':'block'}type.onchange=mode;mode();function mark(el,msg){let p=el.parentElement;p.classList.add('bad');let h=document.createElement('div');h.className='help';h.textContent=msg;p.appendChild(h)}f.onsubmit=e=>{e.preventDefault();document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));document.querySelectorAll('.field>.help').forEach(x=>x.remove());let ok=true;if(!name.value.trim()){mark(name,'Please enter the guest name.');ok=false}let ph=phone.value.replace(/\D/g,'');if(ph.length!==10){mark(phone,'Please enter a valid 10-digit mobile number.');ok=false}if(!type.value){mark(type,'Please choose the enquiry type.');ok=false}if(!pax.value){mark(pax,'Please enter guests / crew.');ok=false}if(type.value==='Day Outing'){if(!day.value){mark(day,'Please select the outing date.');ok=false}}else{if(!from.value){mark(from,'Please select the start/check-in date.');ok=false}if(!to.value){mark(to,'Please select the end/check-out date.');ok=false}}if(!ok){summary.textContent='Please complete the highlighted fields to continue on WhatsApp.';return}let dates=type.value==='Day Outing'?`Visit: ${day.value} (09:00 AM–06:00 PM)`:`From: ${from.value} | To: ${to.value}`;let msg=`Hi Aayush Resort, I have a ${type.value} enquiry.\n\nGuest Name: ${name.value}\nMobile: ${ph}\n${dates}\nGuests/Crew: ${pax.value}${rooms.value?'\nRooms: '+rooms.value:''}\nRequirement: ${note.value||'Not specified'}`;location.href='https://wa.me/918657998551?text='+encodeURIComponent(msg)};</script></body></html>
