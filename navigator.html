<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173925"><title>Aayush Navigator</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f1e8;color:#162018}button,input{font:inherit}.app{max-width:980px;margin:auto;padding:12px 12px 94px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}h1{font-size:20px;margin:0}small{color:#687268}.loc{border:0;border-radius:13px;padding:11px 13px;background:#173925;color:#fff;font-weight:800}.card{background:#fff;border:1px solid #e3e2da;border-radius:20px;box-shadow:0 8px 24px #1521170d;overflow:hidden;margin-bottom:12px}.search{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;position:relative}input{border:1px solid #d9ded7;border-radius:13px;padding:13px 14px;outline:0}input:focus{border-color:#173925}.go{border:0;border-radius:13px;background:#d8b56c;font-weight:900;padding:0 15px}.chips{display:flex;gap:7px;overflow:auto;padding:0 12px 12px}.chip{white-space:nowrap;border:1px solid #dde2da;background:#fff;border-radius:999px;padding:8px 11px;font-weight:700}.res{display:none;position:absolute;top:60px;left:12px;right:12px;z-index:20;background:#fff;border:1px solid #e0e4dd;border-radius:14px;box-shadow:0 14px 30px #0002;max-height:45vh;overflow:auto}.res.show{display:block}.item{display:block;width:100%;text-align:left;border:0;background:#fff;padding:11px 13px;border-bottom:1px solid #eff1ed}.item b{display:block}.maphead{padding:11px 13px;border-bottom:1px solid #eceee9;display:flex;justify-content:space-between;gap:8px;align-items:center}.status{font-size:12px;color:#677267}.map{position:relative;aspect-ratio:4/3;background:#e9efe7;overflow:hidden}svg{width:100%;height:100%;display:block}.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:transparent;padding:0}.pin i{display:grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:#173925;color:#fff;border:2px solid #fff;box-shadow:0 2px 8px #0003;font-style:normal;font-weight:900}.pin i span{transform:rotate(45deg)}.pin.active i{background:#bd7d27;scale:1.12}.you{position:absolute;display:none;width:18px;height:18px;border:4px solid white;border-radius:50%;background:#1877f2;box-shadow:0 0 0 9px #1877f229;transform:translate(-50%,-50%)}.details{display:none;padding:13px}.details.show{display:block}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#778078}.title{font-size:20px;font-weight:900;margin:3px 0 5px}.meta{font-size:13px;line-height:1.45;color:#5f6b61}.actions{display:flex;gap:8px;margin-top:11px}.primary,.secondary{border:0;border-radius:12px;padding:10px 13px;font-weight:850}.primary{background:#173925;color:#fff}.secondary{background:#eef1ec}.warning{font-size:12px;color:#866521;margin-top:9px}.cal{display:none;padding:13px}.cal.show{display:block}.cal button{border:0;border-radius:11px;background:#eef1ec;padding:9px 11px;font-weight:800;margin:3px}pre{white-space:pre-wrap;font-size:10px;background:#f5f6f3;padding:9px;border-radius:10px;max-height:150px;overflow:auto}.bottom{position:fixed;left:0;right:0;bottom:0;background:#f4f1e8ee;backdrop-filter:blur(9px);border-top:1px solid #e2e2da;padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:30}.bottom div{max-width:980px;margin:auto;display:flex;gap:8px}.bottom button{flex:1;border:1px solid #dfe3dc;border-radius:13px;padding:11px;background:#fff;font-weight:850}.bottom .main{background:#173925;color:#fff;border-color:#173925}
</style></head><body><div class="app"><header><div><h1>Aayush Navigator</h1><small>35-acre resort wayfinding prototype</small></div><button class="loc" id="locate">📍 Locate me</button></header><section class="card search"><input id="q" placeholder="Search Palace, Pool, N217, C-19…" autocomplete="off"><button class="go" id="go">Go</button><div class="res" id="res"></div></section><section class="card"><div class="chips"><button class="chip" data-id="palace">🏰 Palace</button><button class="chip" data-id="suhanav">🌿 Suhanav Lawn</button><button class="chip" data-id="pool">🏊 Pool</button><button class="chip" data-id="reception">🛎 Reception</button></div><div class="maphead"><div><b id="mapname">Prototype resort map</b><div class="status" id="status">GPS not enabled</div></div><small id="acc">Not to scale</small></div><div class="map" id="map"><svg viewBox="0 0 1000 750" aria-label="Simplified Aayush Resort map"><rect width="1000" height="750" fill="#eef4eb"/><path d="M780 735 C790 610 760 520 790 420 C820 315 850 210 790 70" fill="none" stroke="#fff" stroke-width="42"/><path d="M780 735 C790 610 760 520 790 420 C820 315 850 210 790 70" fill="none" stroke="#b9c5b8" stroke-width="4" stroke-dasharray="9 8"/><path d="M790 470 C650 430 500 400 320 315 C250 280 235 190 340 145" fill="none" stroke="#fff" stroke-width="34"/><path d="M790 470 C650 430 500 400 320 315 C250 280 235 190 340 145" fill="none" stroke="#c2cdc0" stroke-width="3"/><ellipse cx="585" cy="225" rx="135" ry="92" fill="#dfead8" stroke="#adc2a6"/><text x="585" y="230" text-anchor="middle" fill="#708071" font-size="25">Wedding / Lawn Zone</text><rect x="655" y="345" width="225" height="120" rx="18" fill="#e8d8ca" stroke="#c6a98f"/><text x="767" y="408" text-anchor="middle" fill="#725c4e" font-size="24">Palace Zone</text><path d="M495 65 C560 30 645 50 675 120 C690 175 640 205 590 185 C530 160 460 130 495 65Z" fill="#bfe7ec" stroke="#8abec4"/><text x="585" y="115" text-anchor="middle" fill="#3d6b70" font-size="23">Pool Zone</text><rect x="595" y="565" width="145" height="72" rx="15" fill="#eadfcb" stroke="#c4af8c"/><text x="667" y="606" text-anchor="middle" fill="#71634f" font-size="19">Reception</text><path d="M735 735 L815 735 L808 690 L745 690Z" fill="#d7c7ac"/><text x="775" y="720" text-anchor="middle" fill="#675b49" font-size="17">Gate</text><circle cx="400" cy="450" r="52" fill="#d9ebcf"/><circle cx="380" cy="560" r="38" fill="#d9ebcf"/><circle cx="510" cy="505" r="46" fill="#d9ebcf"/><text x="250" y="705" fill="#8a9589" font-size="18">Prototype only — survey image will replace this after calibration</text></svg><div class="you" id="you"></div></div><div class="details" id="details"><div class="eyebrow" id="kind"></div><div class="title" id="title"></div><div class="meta" id="meta"></div><div class="actions"><button class="primary" id="start">Start navigation</button><button class="secondary" id="clear">Clear</button></div><div class="warning" id="note"></div></div></section><section class="card cal" id="cal"><b>Staff GPS calibration</b><p class="meta">Open this page with <b>?staff=1</b>. Tap a known point on the map while standing there, capture GPS, repeat at 3 places, then send me the JSON.</p><button id="capture">Capture tapped point</button><button id="copy">Copy JSON</button><button id="reset">Reset</button><pre id="out">No anchors yet.</pre></section></div><div class="bottom"><div><button onclick="q.focus()">🔎 Search</button><button class="main" id="bottomLocate">📍 My location</button></div></div><script>
const ROOMS=["501","515","516","C-9","C-10","C-11 A","C-11 B","C-12","C-14","C-19","C-20","C-21","C-22","C-29","C-30","C-31","C-32","C-34","E-26","E-27","E-28","SB-1","502","503","504","505","506","507","508","509","510","511","512","514","C-2","C-3","C-4","C-5","C-6","C-7","C-8","C-15","C-16","C-17","C-18","C-25","C-26","C-27","C-28","E-1","E-2","E-3","E-4","E-5","E-6","E-7","E-8","E-9","E-10","E-11","E-12","E-14","E-15","E-16","E-17","E-18","E-19","E-20","E-21","E-22","E-23","E-24","E-25","N103","N104","N105","N106","N203","N204","N205","N206","N212","N214","N215","N216","N312","N314","N315","N316","N101","N102","N107","N108","N201","N202","N207","N208","N211","N217","N218","N219","N311","N317","N318","N319","T-1","T-2","T-3","T-4","T-5","T-6"];const P=[{id:'entrance',name:'Main Entrance',kind:'Arrival',x:78,y:94,icon:'↗'},{id:'pool',name:'Swimming Pool',kind:'Leisure',x:58,y:16,icon:'≈'},{id:'suhanav',name:'Suhanav Lawn',kind:'Wedding venue',x:58,y:32,icon:'✦'},{id:'palace',name:'Aayush Palace',kind:'Wedding / Shoot venue',x:77,y:57,icon:'♛'},{id:'peacock',name:'Peacock Room',kind:'Venue inside Palace zone',x:75,y:54,icon:'◆'},{id:'reception',name:'Reception & N Rooms',kind:'Stay / Help desk',x:67,y:82,icon:'R'},{id:'manvar',name:'Manvar Hall / 500 Rooms',kind:'Stay / Venue',x:49,y:69,icon:'M'},{id:'dhaba',name:'Dhaba / SB-1',kind:'Dining / Stay',x:46,y:50,icon:'D'}];const ALIASES={entrance:['main entrance','entrance','main gate','gate','entry gate','resort gate','entry'],pool:['swimming pool','pool','poolside','pool side','swimming'],suhanav:['suhanav lawn','suhana lawn','suhanav','suhana','lawn','wedding lawn'],palace:['aayush palace','palace','palace de shaan','palace de shan','de shaan','shoot palace'],peacock:['peacock room','peacock','peacock hall'],reception:['reception','front desk','help desk','lobby','n rooms','n block','n room'],manvar:['manvar hall','manvar','500 rooms','500 room','five hundred rooms','500 block'],dhaba:['dhaba','sb-1','sb1','sb room']};let sel=null,gps=null,tap=null;const $=s=>document.querySelector(s),map=$('#map'),res=$('#res');function norm(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,' ').trim()}function roomKey(s){return norm(s).replace(/^room\s*/,'').replace(/\s+/g,'')}function addPin(p){let b=document.createElement('button');b.className='pin';b.dataset.id=p.id;b.style.left=p.x+'%';b.style.top=p.y+'%';b.innerHTML='<i><span>'+p.icon+'</span></i>';b.onclick=()=>pick(p.id);map.appendChild(b)}P.forEach(addPin);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>pick(b.dataset.id));function cluster(room){let n=room.toUpperCase().replace(/\s/g,'');if(n[0]=='N')return['reception','Above Reception'];if(n.startsWith('E-'))return['palace','Behind / beside Palace'];if(n.startsWith('T-'))return['pool','Near Swimming Pool'];if(/^5\d\d$/.test(n))return['manvar','Above Manvar Hall'];if(n.startsWith('SB-'))return['dhaba','Near Dhaba'];if(n.startsWith('C-')){let v=parseInt(n.match(/\d+/)?.[0]||0);return[v>=25?'pool':'suhanav',v>=25?'Pool-side cottage cluster':'Suhanav-side cottage cluster']}return['reception','Room block'];}function pick(id,room=''){let p=P.find(x=>x.id==id);if(!p)return;sel={...p,room};document.querySelectorAll('.pin').forEach(b=>b.classList.toggle('active',b.dataset.id==id));$('#details').classList.add('show');$('#kind').textContent=room?'Room destination':p.kind;$('#title').textContent=room?'Room '+room:p.name;$('#meta').textContent=room?cluster(room)[1]+' • Navigate to '+p.name+' zone':p.kind;$('#note').textContent='Prototype map pin. Exact GPS alignment and walking paths will be calibrated on site before guest launch.';$('#mapname').textContent=room?'Room '+room:p.name;res.classList.remove('show')}function venueMatch(p,q){let hay=[p.name,p.kind,...(ALIASES[p.id]||[])].map(norm);return hay.some(x=>x===q||x.includes(q)||q.includes(x))}function search(){let raw=$('#q').value.trim(),t=norm(raw);if(!t){res.classList.remove('show');return}let pp=P.filter(p=>venueMatch(p,t)).slice(0,5),rk=roomKey(raw),rr=ROOMS.filter(r=>roomKey(r).includes(rk)).slice(0,12);res.innerHTML=pp.map(p=>'<button class="item" data-p="'+p.id+'"><b>'+p.name+'</b><small>'+p.kind+'</small></button>').join('')+rr.map(r=>'<button class="item" data-r="'+r+'"><b>Room '+r+'</b><small>'+cluster(r)[1]+'</small></button>').join('');if(!res.innerHTML)res.innerHTML='<div class="item"><b>No match</b><small>Try another room or venue.</small></div>';res.classList.add('show');res.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pick(b.dataset.p));res.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{let r=b.dataset.r;pick(cluster(r)[0],r)})}$('#q').oninput=search;$('#go').onclick=search;$('#q').onkeydown=e=>{if(e.key=='Enter')res.querySelector('button')?.click()};$('#clear').onclick=()=>{sel=null;$('#details').classList.remove('show');document.querySelectorAll('.pin').forEach(b=>b.classList.remove('active'));$('#mapname').textContent='Prototype resort map'};function locate(){if(!navigator.geolocation)return $('#status').textContent='GPS unsupported';$('#status').textContent='Finding your location…';navigator.geolocation.watchPosition(p=>{gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};$('#status').textContent='Live GPS active';$('#acc').textContent='±'+Math.round(gps.acc)+' m';apply()},e=>$('#status').textContent=e.message,{enableHighAccuracy:true,maximumAge:1000,timeout:10000})}$('#locate').onclick=locate;$('#bottomLocate').onclick=locate;function anchors(){try{return JSON.parse(localStorage.aayushAnchors||'[]')}catch{return[]}}function project(a,lat,lng){if(a.length<3)return null;let[A,B,C]=a,D=A.lng*(B.lat-C.lat)+B.lng*(C.lat-A.lat)+C.lng*(A.lat-B.lat);if(Math.abs(D)<1e-12)return null;function f(k){let[x,y,z]=[A[k],B[k],C[k]];return[(x*(B.lat-C.lat)+y*(C.lat-A.lat)+z*(A.lat-B.lat))/D,(x*(C.lng-B.lng)+y*(A.lng-C.lng)+z*(B.lng-A.lng))/D,(x*(B.lng*C.lat-C.lng*B.lat)+y*(C.lng*A.lat-A.lng*C.lat)+z*(A.lng*B.lat-B.lng*A.lat))/D]}let X=f('x'),Y=f('y');return{x:X[0]*lng+X[1]*lat+X[2],y:Y[0]*lng+Y[1]*lat+Y[2]}}function apply(){if(!gps)return;let z=project(anchors(),gps.lat,gps.lng),u=$('#you');if(z&&z.x>=0&&z.x<=100&&z.y>=0&&z.y<=100){u.style.left=z.x+'%';u.style.top=z.y+'%';u.style.display='block'}else u.style.display='none'}$('#start').onclick=()=>{if(!sel)return;let qs=new URLSearchParams();if(sel.room){qs.set('room',sel.room);qs.set('to',sel.id)}else qs.set('to',sel.id);try{let at=(sessionStorage.getItem('aayushCheckpoint')||'').toLowerCase();if(P.some(p=>p.id===at))qs.set('from',at)}catch{}location.href='navigator-start.html?'+qs.toString()};const params=new URLSearchParams(location.search);if(params.get('staff')=='1'){$('#cal').classList.add('show');map.onclick=e=>{let r=map.getBoundingClientRect();tap={x:+(((e.clientX-r.left)/r.width)*100).toFixed(5),y:+(((e.clientY-r.top)/r.height)*100).toFixed(5)};$('#out').textContent='Tapped '+JSON.stringify(tap)+' — now capture GPS.'}}$('#capture').onclick=()=>{if(!tap)return alert('Tap the map first');if(!gps)return alert('Enable location first');let a=anchors();a.push({...tap,lat:+gps.lat.toFixed(7),lng:+gps.lng.toFixed(7),accuracy:Math.round(gps.acc)});if(a.length>3)a.shift();localStorage.aayushAnchors=JSON.stringify(a);$('#out').textContent=JSON.stringify(a,null,2);apply()};$('#copy').onclick=async()=>{let t=JSON.stringify(anchors(),null,2);await navigator.clipboard.writeText(t);$('#out').textContent=t+'\nCopied.'};$('#reset').onclick=()=>{delete localStorage.aayushAnchors;$('#out').textContent='No anchors yet.';$('#you').style.display='none'};if(anchors().length)$('#out').textContent=JSON.stringify(anchors(),null,2);const roomPreset=params.get('room')||'',roomExact=ROOMS.find(r=>roomKey(r)===roomKey(roomPreset)),to=(params.get('to')||'').toLowerCase();if(roomExact)pick(cluster(roomExact)[0],roomExact);else if(P.some(p=>p.id===to))pick(to);
</script></body></html>
